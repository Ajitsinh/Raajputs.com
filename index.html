<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raajputs - Community & Culture</title>

  <!-- SEO -->
  <meta name="description" content="Raajputs community website with news, history, and cultural updates.">
  <meta name="keywords" content="Raajputs, Rajput, culture, heritage, community">

  <!-- Open Graph -->
  <meta property="og:site_name" content="Raajputs">
  <meta property="og:title" content="Raajputs - Community and Culture">
  <meta property="og:description" content="Official Raajputs website featuring history, culture, and updates.">
  <meta property="og:image" content="https://cdn2.editmysite.com/images/editor/theme-background/stock/Sky.jpg">
  <meta property="og:url" content="https://raajputs.weebly.com/">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700|Playfair+Display:400,700,400italic,700italic&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="files/theme/Fevicon-Aum.png">

  <style>
    :root {
      --bg-color: #f9f9f9;
      --text-color: #222;
      --header-bg: #fff;
      --link-color: #0077cc;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #eaeaea;
      --header-bg: #1e1e1e;
      --link-color: #66aaff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    header {
      background: var(--header-bg);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #4442;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: var(--text-color);
      font-weight: bold;
    }

    nav a:hover {
      color: var(--link-color);
    }

    .theme-toggle {
      background: var(--link-color);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    main {
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    section {
      margin-bottom: 3rem;
    }

    .fb-embed {
      width: 100%;
      max-width: 600px;
      margin: 1rem auto;
    }

    iframe {
      width: 100%;
      border: none;
      min-height: 400px;
    }

    footer {
      background: var(--header-bg);
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      border-top: 1px solid #4442;
    }
  </style>
</head>
<body>
  <header>
    <h1>Raajputs</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">History</a>
      <a href="#">Community</a>
      <a href="#">Contact</a>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
  </header>

  <main>
    <section>
      <h2>Welcome to Raajputs</h2>
      <p>
        The official Raajputs website – connecting our community with history, culture, and updates.
      </p>
    </section>

    <section>
      <h2>Facebook Updates</h2>
      <div class="fb-embed">
        <!-- Example Facebook Embed (replace with yours) -->
        <iframe src="https://www.facebook.com/plugins/page.php?
          href=https%3A%2F%2Fwww.facebook.com%2Fraajputs
          &tabs=timeline
          &width=500
          &height=600
          &small_header=false
          &adapt_container_width=true
          &hide_cover=false
          &show_facepile=true">
        </iframe>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 Raajputs. All rights reserved.
  </footer>

  <script>
    function toggleTheme() {
      const body = document.body;
      const currentTheme = body.getAttribute("data-theme");
      if (currentTheme === "dark") {
        body.removeAttribute("data-theme");
      } else {
        body.setAttribute("data-theme", "dark");
      }
    }
  </script>
</body>
</html>
